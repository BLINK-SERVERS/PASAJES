<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFEFB" />
    <script>
      (function () {
        try {
          var modo = localStorage.getItem("blink-tema") || "auto";
          var html = document.documentElement;
          html.style.colorScheme =
            modo === "auto" ? "light dark" : modo === "claro" ? "light" : "dark";
          html.dataset.tema = modo;
          var oscuro =
            modo === "oscuro" ||
            (modo === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          html.classList.toggle("dark", oscuro);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", oscuro ? "#000000" : "#FFFEFB");
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="BLINK PASAJES — cobro de pasajes con tarjeta MIFARE y lector RC522." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>BLINK PASAJES</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
